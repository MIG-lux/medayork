<link rel="icon" type="image/png" href="img/icono-48.png">

<body>
<!-- Página pensada para tomarle captura en el celular y subirla a historias (formato 9:16).
     Muestra los productos que en la hoja tienen "nuevo = sí", de a 4 por pantalla. -->
<main class="historia-f">
  <div class="historia" id="historia">
    <div class="h-cab">
      <img src="img/estatua-claro.png" alt="Medayork" width="89" height="120">
      <span class="mono">[ MDE ⇄ JFK ]</span>
    </div>
    <span class="sello">Original</span>
    <h1 class="disp">Llegadas<br>de la semana</h1>
    <div class="ser">Original style.</div>
    <div class="h-rejilla" id="rejilla"></div>
    <div class="h-pie">
      <div class="mono">Pide por WhatsApp<br>@meda_yorkshop</div>
      <span class="barras" aria-hidden="true"></span>
    </div>
  </div>
  <div class="h-ctrl mono">
    <button class="btn" id="ant" type="button">← Anterior</button>
    <span id="pag"></span>
    <button class="btn" id="sig" type="button">Siguiente →</button>
    <a class="btn" href="index.html">Tienda</a>
  </div>
  <noscript><p style="color:#EFECE6;padding:14px">Activa JavaScript para ver las llegadas, o entra a la tienda.</p></noscript>
</main>

<script src="datos/conexion.js?v=20261117"></script>
<script src="datos/respaldo.js?v=20261118"></script>
<script src="js/datos.js?v=20261117"></script>
<script>
(function(){
  var MY=window.MY, POR_PANTALLA=4, pagina=0, lista=[];
  var $=function(s){return document.querySelector(s)};
  function pinta(){
    var total=Math.max(1,Math.ceil(lista.length/POR_PANTALLA));
    pagina=(pagina+total)%total;
    var ver=lista.slice(pagina*POR_PANTALLA,pagina*POR_PANTALLA+POR_PANTALLA);
    $('#rejilla').innerHTML=ver.length?ver.map(function(p){
      return '<div class="h-item'+(p.seccion==='mujer'?' m':'')+'"><img src="'+MY.esc(MY.foto(p.fotos[0]))+'" alt="'+MY.esc(p.nombre+' '+(p.marca||''))+'" width="800" height="1000">'+
        '<div><b>'+MY.esc(p.nombre)+(p.marca?' '+MY.esc(p.marca):'')+'</b>'+MY.precioHTML(p)+(p.tallas&&p.tallas.length?' · Talla '+MY.esc(p.tallas.join(' · ')):'')+'</div></div>';
    }).join(''):'<p class="mono" style="grid-column:1/-1;align-self:center;text-align:center">Esta semana todavía no marcamos llegadas.</p>';
    $('#pag').textContent=(pagina+1)+' de '+total;
    $('#ant').hidden=$('#sig').hidden=total<2;
  }
  $('#ant').addEventListener('click',function(){pagina--;pinta()});
  $('#sig').addEventListener('click',function(){pagina++;pinta()});
  MY.cargar(function(d){
    lista=d.productos.filter(function(p){return p.visible!==false&&p.nuevo&&p.fotos&&p.fotos.length&&p.estado!=='agotado'});
    pinta();
  });
})();
</script>
</body>
</html>
